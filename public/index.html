<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="beta: an interactive node.js playground">
  <title>beta // nicholas-oswald</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <main>
    <header>
      <h1 class="glitch" data-text="nicholas@oswald:~$">nicholas<span>@</span>oswald<span>:~$</span></h1>
      <p class="tag">beta // node.js // whitelisted shell // tunnel-hosted</p>
    </header>

    <section class="grid">
      <div class="panel">
        <h2>system</h2>
        <dl>
          <dt>uptime</dt><dd id="s-uptime">--</dd>
          <dt>load</dt><dd id="s-load">--</dd>
          <dt>memory</dt><dd id="s-mem">--</dd>
          <dt>cores</dt><dd id="s-cores">--</dd>
          <dt>node</dt><dd id="s-node">--</dd>
          <dt>clock</dt><dd id="s-time">--</dd>
        </dl>
        <canvas id="spark" width="300" height="70" aria-label="1-minute load history"></canvas>
      </div>

      <div class="panel">
        <h2>terminal</h2>
        <div id="out" aria-live="polite"></div>
        <form id="form" autocomplete="off">
          <span class="prompt">guest@beta:~$</span>
          <input id="cmd" type="text" maxlength="32" spellcheck="false" aria-label="command" autofocus>
        </form>
      </div>
    </section>

    <footer>
      <span>type <b>help</b> to list commands</span>
      <span>up/down: history &middot; clear: wipe screen</span>
    </footer>
  </main>

  <noscript><p class="dim">This page needs JavaScript for the terminal and live panels.</p></noscript>
  <script src="/app.js" defer></script>
</body>
</html>
